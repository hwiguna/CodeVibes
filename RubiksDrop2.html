<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Drop: Shatter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #ui {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #ccc;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10;
        }

        #ui h3 { 
            color: #fff; 
            font-size: 13px; 
            letter-spacing: 2px; 
            margin-bottom: 12px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 4px;
        }

        #ui .row { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 4px; align-items: center; }
        #ui .key { color: #aaa; }
        #ui .val { color: #00f2ff; font-weight: bold; }

        .checkbox-container {
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #00f2ff;
            border-radius: 3px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            margin-left: 8px;
        }
        input[type="checkbox"]:checked {
            background: #00f2ff;
        }
        input[type="checkbox"]:checked::after {
            content: '✓';
            color: #000;
            position: absolute;
            font-size: 10px;
            left: 2px;
            top: -1px;
        }

        .btn-container {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }

        #drop-btn {
            background: #00f2ff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: auto;
        }

        #drop-btn:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        #drop-btn:active {
            transform: scale(0.95);
        }

        #ui .hint {
            color: #888;
            font-size: 10px;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div id="ui">
    <h3>RUBIK'S SHATTER</h3>
    <div class="row"><span class="key">GRAVITY</span>        <span class="val">-18 m/s²</span></div>
    <div class="row"><span class="key">FOCUS</span>          <span class="val">Tight</span></div>
    <div class="row">
        <span class="key">AUTO-TRACK</span>
        <label class="checkbox-container">
            <input type="checkbox" id="track-toggle" checked>
        </label>
    </div>
    
    <div class="btn-container">
        <button id="drop-btn">New Drop</button>
    </div>

    <div class="hint">
        Left Click: Orbit<br>
        Right Click: Pan<br>
        Scroll: Zoom
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
// ———————————————————————————————————————————————————————————————
//  CONSTANTS
// ———————————————————————————————————————————————————————————————
const GRAVITY         = -18;   
const RESTITUTION     = 0.55;  
const FRICTION        = 0.4;  
const DROP_HEIGHT     = 9;    
const INITIAL_SIZE    = 1.5;   

const FC = { px: 0x0046ad, nx: 0x009b48, py: 0xffffff, ny: 0xffd500, pz: 0xb71234, nz: 0xff5800, inner: 0x111111 };

// ———————————————————————————————————————————————————————————————
//  GEOMETRY REUSE
// ———————————————————————————————————————————————————————————————
const cubeGeoMap = new Map();
function getCubeGeo(size) {
    let key = size.toFixed(4);
    if (!cubeGeoMap.has(key)) {
        cubeGeoMap.set(key, new THREE.BoxGeometry(size, size, size));
    }
    return cubeGeoMap.get(key);
}

// ———————————————————————————————————————————————————————————————
//  SETUP
// ———————————————————————————————————————————————————————————————
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 2.2; 
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a); // Darker space
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6, 6, 8); 

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

let isInteracting = false;
let interactionTimer = null;
controls.addEventListener('start', () => {
    isInteracting = true;
    clearTimeout(interactionTimer);
});
controls.addEventListener('end', () => {
    interactionTimer = setTimeout(() => {
        isInteracting = false;
    }, 2000); 
});

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444466, 0.8);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(15, 25, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ———————————————————————————————————————————————————————————————
//  GROUND SYSTEM (RESTORED GRID)
// ———————————————————————————————————————————————————————————————
const floorGroup = new THREE.Group();
scene.add(floorGroup);

// The visible solid plane
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ 
        color: 0x161625, 
        roughness: 0.8, 
        metalness: 0.2,
        transparent: false 
    })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floorGroup.add(floor);

// Primary high-contrast grid
const gridHelper = new THREE.GridHelper(200, 50, 0x00f2ff, 0x222244);
gridHelper.position.y = 0.01; // Slightly above floor to prevent z-fighting
floorGroup.add(gridHelper);

// Radial "Glow" at impact zone
const impactGlow = new THREE.Mesh(
    new THREE.CircleGeometry(10, 32),
    new THREE.MeshBasicMaterial({ 
        color: 0x00f2ff, 
        transparent: true, 
        opacity: 0.05,
        blending: THREE.AdditiveBlending 
    })
);
impactGlow.rotation.x = -Math.PI / 2;
impactGlow.position.y = 0.02;
floorGroup.add(impactGlow);

// ———————————————————————————————————————————————————————————————
//  PHYSICS SETUP
// ———————————————————————————————————————————————————————————————
const world = new CANNON.World();
world.gravity.set(0, GRAVITY, 0);
world.broadphase = new CANNON.NaiveBroadphase();
world.solver.iterations = 7;

const physMat = new CANNON.Material();
world.addContactMaterial(new CANNON.ContactMaterial(physMat, physMat, { friction: FRICTION, restitution: RESTITUTION }));

const groundBody = new CANNON.Body({ mass: 0, material: physMat });
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
world.addBody(groundBody);

// ———————————————————————————————————————————————————————————————
//  LOGIC
// ———————————————————————————————————————————————————————————————
let activeCubes = [];
let pendingShatters = []; 
const trackToggle = document.getElementById('track-toggle');

function spawnCube(x, y, z, size, level, velocity, angularVelocity, parentQuat, faces = null) {
    const half = size / 2;
    const mass = (size ** 3) * 1.5;
    
    const body = new CANNON.Body({
        mass: mass,
        position: new CANNON.Vec3(x, y, z),
        material: physMat,
        linearDamping: 0.01,
        angularDamping: 0.15
    });
    body.addShape(new CANNON.Box(new CANNON.Vec3(half, half, half)));
    if (velocity) body.velocity.copy(velocity);
    if (angularVelocity) body.angularVelocity.copy(angularVelocity);
    if (parentQuat) body.quaternion.copy(parentQuat);
    
    let mesh;
    if (level === 3) {
        mesh = buildRubiksMesh(size);
    } else {
        const mats = faces ? faces.map(c => new THREE.MeshStandardMaterial({color: c, roughness: 0.3})) : 
                           [FC.px, FC.nx, FC.py, FC.ny, FC.pz, FC.nz].map(c => new THREE.MeshStandardMaterial({color: c, roughness: 0.3}));
        mesh = new THREE.Mesh(getCubeGeo(size * 0.94), mats);
    }
    
    mesh.castShadow = true;
    scene.add(mesh);
    world.addBody(body);

    const cubeObj = { body, mesh, level, size, shattered: false };

    body.addEventListener('collide', (e) => {
        if (cubeObj.shattered || level <= 1) return;
        const impact = Math.abs(e.contact.getImpactVelocityAlongNormal());
        if (impact > 2.0) {
            cubeObj.shattered = true;
            pendingShatters.push(cubeObj);
        }
    });

    activeCubes.push(cubeObj);
}

function processShatters() {
    if (pendingShatters.length === 0) return;

    pendingShatters.forEach(cubeObj => {
        const { level, size, body, mesh } = cubeObj;
        world.remove(body);
        scene.remove(mesh);
        activeCubes = activeCubes.filter(c => c !== cubeObj);

        const subSize = size / 3;
        const pos = body.position;
        const vel = body.velocity;
        const angVel = body.angularVelocity;
        const quat = body.quaternion;

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const localPos = new THREE.Vector3(x * subSize, y * subSize, z * subSize);
                    localPos.applyQuaternion(new THREE.Quaternion(quat.x, quat.y, quat.z, quat.w));

                    const burst = new CANNON.Vec3(
                        (Math.random() - 0.5) * 2.5,
                        Math.random() * 2.5, 
                        (Math.random() - 0.5) * 2.5
                    );

                    const subFaces = [
                        x === 1 ? FC.px : FC.inner, x === -1 ? FC.nx : FC.inner,
                        y === 1 ? FC.py : FC.inner, y === -1 ? FC.ny : FC.inner,
                        z === 1 ? FC.pz : FC.inner, z === -1 ? FC.nz : FC.inner
                    ];

                    spawnCube(
                        pos.x + localPos.x, pos.y + localPos.y, pos.z + localPos.z,
                        subSize,
                        level - 1,
                        vel.vadd(burst),
                        angVel,
                        quat,
                        subFaces
                    );
                }
            }
        }
    });

    pendingShatters = [];
}

function buildRubiksMesh(size) {
    const group = new THREE.Group();
    const cs = size / 3;
    const edge = cs * 0.94;
    const sharedCubieGeo = getCubeGeo(edge);
    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
                if (x === 0 && y === 0 && z === 0) continue;
                const mats = [
                    new THREE.MeshStandardMaterial({ color: x === 1 ? FC.px : FC.inner, roughness: 0.3 }),
                    new THREE.MeshStandardMaterial({ color: x === -1 ? FC.nx : FC.inner, roughness: 0.3 }),
                    new THREE.MeshStandardMaterial({ color: y === 1 ? FC.py : FC.inner, roughness: 0.3 }),
                    new THREE.MeshStandardMaterial({ color: y === -1 ? FC.ny : FC.inner, roughness: 0.3 }),
                    new THREE.MeshStandardMaterial({ color: z === 1 ? FC.pz : FC.inner, roughness: 0.3 }),
                    new THREE.MeshStandardMaterial({ color: z === -1 ? FC.nz : FC.inner, roughness: 0.3 }),
                ];
                const cubie = new THREE.Mesh(sharedCubieGeo, mats);
                cubie.position.set(x * cs, y * cs, z * cs);
                group.add(cubie);
            }
        }
    }
    return group;
}

function resetWorld() {
    activeCubes.forEach(c => {
        world.remove(c.body);
        scene.remove(c.mesh);
    });
    activeCubes = [];
    pendingShatters = [];
    
    spawnCube(
        0, DROP_HEIGHT, 0, 
        INITIAL_SIZE, 
        3, 
        new CANNON.Vec3(0, -12, 0), 
        new CANNON.Vec3(Math.random()*8, Math.random()*8, Math.random()*8),
        null
    );
}

document.getElementById('drop-btn').addEventListener('click', () => resetWorld());

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function updateCameraTracking() {
    if (!trackToggle.checked || activeCubes.length === 0) return;

    const avgPos = new THREE.Vector3(0, 0, 0);
    activeCubes.forEach(c => {
        avgPos.x += c.body.position.x;
        avgPos.y += c.body.position.y;
        avgPos.z += c.body.position.z;
    });
    avgPos.divideScalar(activeCubes.length);

    controls.target.lerp(avgPos, 0.1);

    if (!isInteracting) {
        const isShattering = activeCubes.length > 20;
        const orbitSpeed = isShattering ? 0.015 : 0.005;
        const targetZoomDist = 5.5;
        
        const currentAngle = Math.atan2(camera.position.z - controls.target.z, camera.position.x - controls.target.x);
        let distance = new THREE.Vector3().subVectors(camera.position, controls.target).length();
        
        distance = THREE.MathUtils.lerp(distance, targetZoomDist, 0.04);

        const nextAngle = currentAngle + orbitSpeed;
        camera.position.x = controls.target.x + Math.cos(nextAngle) * distance;
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, controls.target.y + 2.5, 0.04);
        camera.position.z = controls.target.z + Math.sin(nextAngle) * distance;
    }
}

const fixedStep = 1 / 60;
function animate() {
    requestAnimationFrame(animate);
    
    world.step(fixedStep);
    processShatters();

    for (let i = activeCubes.length - 1; i >= 0; i--) {
        const c = activeCubes[i];
        c.mesh.position.copy(c.body.position);
        c.mesh.quaternion.copy(c.body.quaternion);

        if (c.body.position.y < -20) {
            world.remove(c.body);
            scene.remove(c.mesh);
            activeCubes.splice(i, 1);
        }
    }

    updateCameraTracking();
    controls.update();
    renderer.render(scene, camera);
}

window.onload = () => {
    resetWorld();
    animate();
};
</script>
</body>
</html>
